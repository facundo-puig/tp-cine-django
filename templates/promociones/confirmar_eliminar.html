{% extends 'base.html' %}

{% block titulo %}Eliminar promoción{% endblock %}

{% block contenido %}
<div class="max-w-md mx-auto text-center">
    <h1 class="text-2xl font-semibold text-texto mb-4">¿Eliminar "{{ promocion.titulo }}"?</h1>
    <p class="text-texto-sec mb-8">Esta acción no se puede deshacer.</p>

    <form method="post" class="flex justify-center gap-4">
        {% csrf_token %}
        <button type="submit"
            class="bg-red-600 hover:bg-red-700 text-texto font-semibold py-2 px-6 rounded-lg transition-colors">
            Eliminar
        </button>
        <a href="{% url 'detalle_promocion' promocion.pk %}"
            class="border border-borde text-texto-sec hover:text-texto py-2 px-6 rounded-lg transition-colors">
            Cancelar
        </a>
    </form>
</div>
{% endblock %}
