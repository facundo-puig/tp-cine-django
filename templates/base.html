<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Cine{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'background': '#0F0F0F',
                        'card': '#1A1A1A',
                        'primary': '#7C3AED',
                        'primary-hover': '#8B5CF6',
                        'texto': '#FFFFFF',
                        'texto-sec': '#B3B3B3',
                        'borde': '#2A2A2A',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-background text-texto min-h-screen">

    <nav class="border-b border-borde px-8 py-4 flex items-center justify-between">
        <a href="{% url 'home' %}" class="text-primary font-semibold text-xl tracking-wide">
            {{ nombre_cine }}
        </a>
        <div class="flex gap-6 text-sm text-texto-sec items-center">
            <a href="{% url 'home' %}" class="hover:text-texto transition-colors">Cartelera</a>

            <!-- Dropdown de películas -->
            <div class="relative group">
                <span class="hover:text-texto transition-colors cursor-pointer">Películas</span>
                <div class="absolute hidden group-hover:block bg-card border border-borde rounded-lg py-2 w-48 z-10">
                    {% for pelicula in peliculas_cartelera %}
                    <a href="{% url 'detalle_pelicula' pelicula.pk %}"
                        class="block px-4 py-2 text-texto-sec hover:text-texto hover:bg-background transition-colors text-sm">
                        {{ pelicula.titulo }}
                    </a>
                    {% endfor %}
                </div>
            </div>

            <a href="{% url 'listado_promociones' %}" class="hover:text-texto transition-colors">Promociones</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-10">
        {% block contenido %}{% endblock %}
    </main>

    <footer class="border-t border-borde text-center text-texto-sec text-sm py-6 mt-10">
        © {{ year }} {{ nombre_cine }}
    </footer>

</body>

</html>
